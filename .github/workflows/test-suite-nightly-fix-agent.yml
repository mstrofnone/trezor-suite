name: "[Test] Nightly Suite Fix Agent"

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: node_modules-

      - name: Install dependencies
        run: yarn workspaces focus @trezor/e2e-utils

      - name: Run analysis agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.E2E_CLAUDE_API_KEY }}
          CURRENTS_API_KEY: ${{ secrets.CURRENTS_API_KEY }}
        run: yarn tsx packages/e2e-utils/src/fixBot/analyze.ts

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: fix-agent-report
          path: packages/e2e-utils/src/fixBot/reports/
          if-no-files-found: error

  prepare-matrix:
    needs: [analyze]
    runs-on: ubuntu-latest
    if: github.repository == 'trezor/trezor-suite'
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      has-tasks: ${{ steps.set-matrix.outputs.has-tasks }}
    steps:
      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/

      - name: Build matrix from report
        id: set-matrix
        run: |
          REPORT_FILE=$(ls report-download/*.json)
          MATRIX=$(jq -c '[.fix_tasks[].id]' "$REPORT_FILE")
          HAS_TASKS=$(jq -r 'if (.fix_tasks | length) > 0 then "true" else "false" end' "$REPORT_FILE")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "has-tasks=$HAS_TASKS" >> $GITHUB_OUTPUT

  build-desktop:
    if: github.repository == 'trezor/trezor-suite'
    uses: ./.github/workflows/build-suite-desktop-e2e.yml
    secrets: inherit

  fix:
    needs: [prepare-matrix, build-desktop]
    runs-on: ubuntu-24.04
    if: github.repository == 'trezor/trezor-suite' && needs.prepare-matrix.outputs.has-tasks == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        task-id: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}
    env:
      COMPOSE_FILE: ./docker/docker-compose.suite-ci-e2e.yml

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6
        with:
          node-version-file: ".nvmrc"
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
        with:
          path: node_modules
          key: node_modules-${{ hashFiles('yarn.lock') }}
          restore-keys: node_modules-

      - name: Install dependencies
        run: yarn workspaces focus @trezor/suite-e2e @trezor/e2e-utils @trezor/suite-web

      - name: Install Playwright browsers
        run: yarn workspace @trezor/suite-e2e exec playwright install chromium --with-deps

      - name: Build message system config
        run: yarn message-system-sign-config 1>/dev/null

      - name: Build suite-data lib
        run: yarn workspace @trezor/suite-data build:lib

      - name: Build suite-web
        run: yarn workspace @trezor/suite-web build

      - name: Download desktop artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-app-build-e2e
          path: artifact-download

      - name: Extract desktop artifact
        run: tar -xzf artifact-download/app-build.tar.gz -C packages/suite-desktop

      - name: Download report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: fix-agent-report
          path: report-download/

      - name: Set REPORT_PATH
        run: echo "REPORT_PATH=$(ls report-download/*.json)" >> $GITHUB_ENV

      - name: Pull Docker images
        run: docker compose pull --quiet

      - name: Start Docker services
        run: docker compose up -d

      - name: Start web preview server
        run: nohup yarn workspace @trezor/suite-web preview > /tmp/web-preview.log 2>&1 &

      - name: Wait for web preview server
        timeout-minutes: 2
        run: curl -sf --retry 30 --retry-delay 2 --retry-connrefused --max-time 5 http://localhost:8000 -o /dev/null

      # ── DEBUG ────────────────────────────────────────────────────────────────
      - name: Debug - listening ports
        if: always()
        run: ss -tlnp || netstat -tlnp || true

      - name: Debug - web preview logs
        if: always()
        run: cat /tmp/web-preview.log || true

      - name: Debug - suite-web build output
        if: always()
        run: ls -lh packages/suite-web/build/ | head -30 || true

      - name: Debug - docker compose ps
        if: always()
        run: docker compose ps

      - name: Debug - docker compose logs
        if: always()
        run: docker compose logs --tail=80

      - name: Debug - curl suite-web
        if: always()
        run: |
          echo "=== HTTP response headers ==="
          curl -sv http://localhost:8000 -o /dev/null 2>&1 | head -40 || true

      - name: Debug - env and report
        if: always()
        run: |
          echo "REPORT_PATH=$REPORT_PATH"
          echo "BRANCH=$BRANCH"
          echo "=== report contents ==="
          cat "$REPORT_PATH" | head -60 || true
      # ── END DEBUG ─────────────────────────────────────────────────────────────

      # # This needs to be discussed with Tali
